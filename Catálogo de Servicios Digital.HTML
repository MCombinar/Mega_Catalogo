            colors: {
              mega: {
                blue: '#0055A4',
                lightblue: '#00A1E0',
                green: '#8DC63F',
                red: '#ED1C24',
                dark: '#231F20',

// COMPONENTS DEFINITION

const MegaLogo = (props) => (

const Hero = () => {

const BenefitCard = ({ icon, title, description }) => (

);

const Benefits = () => {
  const benefits = [
    {
      icon: 'fa-solid fa-gauge-high',
      title: 'Internet Simétrico',
      description: '¡Sube y baja archivos a la misma velocidad! Ideal para home office, clases en línea y gaming.',
    },
    {
      icon: 'fa-solid fa-tv',
      title: 'Xview+ Interactivo',

const AppLogo = ({ appName }) => {

    'NETFLIX': 'https://img.icons8.com/color/48/netflix.png',
    'amazon prime': 'https://img.icons8.com/color/48/amazon-prime-video.png',
    'Wifi Ultra': 'https://img.icons8.com/fluency/48/wifi.png',
  };
  return <img src={logos[appName]} alt={`${appName} logo`} className="w-8 h-8"/>;
};

const PlanCard = ({ speed, price, features, apps, highlight }) => {
    const whatsappMessage = encodeURIComponent(`Hola Marco, me interesa el paquete de ${speed} Megas. ¿Me puedes dar más información?`);
    return (
        <div className={`bg-white rounded-2xl shadow-lg border-2 transition-transform duration-300 hover:-translate-y-2 ${highlight ? 'border-mega-blue scale-105' : 'border-transparent'}`}>

                <h3 className="text-2xl font-bold text-center">
                    <span className="text-5xl">{speed}</span> MEGAS
                </h3>
                <p className="text-center font-semibold">{highlight ? 'Paquete Recomendado' : 'TV INTERACTIVA'}</p>
            </div>
            <div className="p-6">

                    <span className="text-5xl font-extrabold text-mega-dark">${price}</span>
                    <span className="text-gray-500">/ al mes x 6 meses*</span>

                <ul className="space-y-3 my-6 text-gray-700">

                        <li key={index} className="flex items-center">
                            <i className="fas fa-check-circle text-mega-green mr-3"></i>

                            <span className="text-xs mt-1 text-gray-600">{app}</span>
                        </div>
                    ))}
                </div>
            </div>
            <div className="p-6 bg-gray-50 rounded-b-2xl">
                 <a href={`https://wa.me/5215522685235?text=${whatsappMessage}`}
                   target="_blank"
                   rel="noopener noreferrer" 
                   className="block w-full text-center bg-mega-red hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-300">
                    ¡Lo Quiero!
                </a>
            </div>
        </div>
    );
};

const ResidentialPlans = () => {

const Check = () => <i className="fas fa-check text-mega-green text-xl"></i>;
const Cross = () => <i className="fas fa-times text-red-500 text-xl"></i>;

    { name: 'Telefonía Ilimitada (MX, EU, CAN)', mega: true, other: true },
    { name: 'Instalación sin Costo', mega: true, other: false },

  return (
    <section id="comparison" className="py-16 sm:py-20 bg-gray-100">

        <h2 className="text-3xl sm:text-4xl font-extrabold text-center mb-12 text-mega-dark">

const WhatsAppButton = ({ phoneNumber }) => {
  const message = "Hola Marco, vi el catálogo digital y me gustaría más información sobre los servicios de MEGA.";
  const encodedMessage = encodeURIComponent(message);
  const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

  return (
    <a
      href={whatsappUrl}
      target="_blank"
      rel="noopener noreferrer"
      className="fixed bottom-5 right-5 bg-green-500 hover:bg-green-600 text-white rounded-full w-16 h-16 flex items-center justify-center shadow-lg transform hover:scale-110 transition-transform duration-300 z-50"
      aria-label="Contactar por WhatsApp"

  );
};
